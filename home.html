<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="在庫"><title>在庫</title><link rel="apple-touch-icon" href="icon.svg?v=8"><link rel="manifest" href="manifest.webmanifest?v=8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.view{position:fixed;inset:0 0 72px;width:100%;height:calc(100% - 72px);border:0;background:#f3f4f6}.tabs{position:fixed;z-index:999;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));height:60px;padding:5px;display:flex;gap:5px;background:#fff;border:1px solid #d1d5db;border-radius:18px;box-shadow:0 6px 28px #0003}.tab{flex:1;border:0;border-radius:13px;background:#f3f4f6;color:#4b5563;font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.tab.on{background:#111827;color:#fff}.tab span{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}</style></head><body><iframe id="view" class="view" title="在庫"></iframe><nav class="tabs"><button id="listTab" class="tab">在庫一覧<span>メモ・写真</span></button><button id="mapTab" class="tab">マップ作成<span>前レジ配置</span></button></nav><script>const v=document.getElementById('view'),list=document.getElementById('listTab'),map=document.getElementById('mapTab');function show(which){const isMap=which==='map';list.classList.toggle('on',!isMap);map.classList.toggle('on',isMap);v.src=isMap?'./map.html?v=8':'./index.html?v=8';history.replaceState(null,'',isMap?'#map':'#list')}list.onclick=()=>show('list');map.onclick=()=>show('map');show(location.hash==='#map'?'map':'list');</script></body></html>
