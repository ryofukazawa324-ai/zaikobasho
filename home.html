<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>在庫</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.tabs{position:fixed;z-index:20;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));height:58px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 5px 24px #0002;display:flex;padding:5px;gap:5px}.tab{flex:1;border:0;border-radius:13px;background:transparent;font:inherit;font-weight:800;color:#6b7280}.tab.on{background:#111827;color:#fff}.view{position:fixed;inset:0 0 78px;border:0;width:100%;height:calc(100% - 78px);background:#f3f4f6}</style></head><body><iframe id="view" class="view" src="./"></iframe><nav class="tabs"><button class="tab on" data-page="./">在庫一覧</button><button class="tab" data-page="map.html">前レジマップ</button></nav><script>const v=document.getElementById('view'),tabs=[...document.querySelectorAll('.tab')];tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.toggle('on',x===b));v.src=b.dataset.page});addEventListener('message',e=>{if(e.data==='open-map'){tabs[1].click()}if(e.data==='open-list'){tabs[0].click()}});</script></body></html>
