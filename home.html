<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="在庫"><title>在庫</title><link rel="apple-touch-icon" href="icon.svg?v=8"><link rel="manifest" href="manifest.webmanifest?v=8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.view{position:fixed;inset:0 0 72px;width:100%;height:calc(100% - 72px);border:0;background:#f3f4f6}.tabs{position:fixed;z-index:999;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));height:60px;padding:5px;display:flex;gap:5px;background:#fff;border:1px solid #d1d5db;border-radius:18px;box-shadow:0 6px 28px #0003}.tab{flex:1;border:0;border-radius:13px;background:#f3f4f6;color:#4b5563;font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.tab.on{background:#111827;color:#fff}.tab span{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}.undo{position:fixed;z-index:1000;right:16px;bottom:82px;border:1px solid #d1d5db;border-radius:14px;background:#fff;color:#111827;padding:10px 14px;font:800 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;box-shadow:0 4px 18px #0002}.undo:disabled{opacity:.4}.hidden{display:none!important}</style></head><body><iframe id="view" class="view" title="在庫"></iframe><button id="undo" class="undo hidden" disabled>↶ 1つ戻す</button><nav class="tabs"><button id="listTab" class="tab">在庫一覧<span>メモ・写真</span></button><button id="mapTab" class="tab">マップ作成<span>前レジ配置</span></button></nav><script>const v=document.getElementById('view'),list=document.getElementById('listTab'),mapTab=document.getElementById('mapTab'),undo=document.getElementById('undo');let lastState=null,lastKey='';function snapshot(){try{let w=v.contentWindow,s=w.eval('JSON.stringify(map)');if(s&&s!==lastKey){lastState=lastKey||s;lastKey=s;undo.disabled=!lastState}}catch(e){}}function fitMapText(){try{let d=v.contentDocument;if(!d||!mapTab.classList.contains('on'))return;d.querySelectorAll('.block').forEach(block=>{let name=block.querySelector('.blockName'),text=block.querySelector('.blockContents');if(name){name.style.fontSize=text?'9px':'12px';name.style.lineHeight='1.05';name.style.flexShrink='0'}if(!text)return;text.style.overflow='hidden';text.style.fontWeight='900';text.style.lineHeight='1.1';text.style.alignItems='center';text.style.wordBreak='break-word';let size=14;text.style.fontSize=size+'px';while(size>6&&(text.scrollHeight>text.clientHeight+1||text.scrollWidth>text.clientWidth+1)){size-=.5;text.style.fontSize=size+'px'}if(text.scrollHeight>text.clientHeight+1||text.scrollWidth>text.clientWidth+1){name.style.fontSize='7px';name.style.padding='0';name.style.margin='0 0 1px';while(size>5&&(text.scrollHeight>text.clientHeight+1||text.scrollWidth>text.clientWidth+1)){size-=.5;text.style.fontSize=size+'px'}}})}catch(e){}}function applyMapTextStyle(){try{let d=v.contentDocument;if(!d||!mapTab.classList.contains('on'))return;if(!d.getElementById('priority-map-text')){let s=d.createElement('style');s.id='priority-map-text';s.textContent='.blockInner{inset:3px!important}.block.hasContents .blockName{flex:0 0 auto!important;padding:1px 2px 2px!important;margin:0 0 2px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;opacity:.82}.blockContents{flex:1 1 auto!important;min-height:0!important;padding:1px 2px!important;display:flex!important;justify-content:center!important;text-align:center!important;white-space:pre-wrap!important}.block:not(.hasContents) .blockName{align-self:center!important;margin:auto 0!important}';d.head.appendChild(s)}fitMapText()}catch(e){}}function armUndo(){try{let d=v.contentDocument;if(!d)return;lastState=null;lastKey=v.contentWindow.eval('JSON.stringify(map)');undo.disabled=true;d.addEventListener('pointerdown',snapshot,true);d.addEventListener('change',()=>{snapshot();setTimeout(fitMapText,20)},true);d.addEventListener('click',e=>{if(e.target.closest('#saveBlock,#removeBlock,#duplicateBlock,#distribute,#deleteLine,[data-color]')){snapshot();setTimeout(fitMapText,20)}},true);let target=d.getElementById('blocks');if(target)new MutationObserver(()=>requestAnimationFrame(fitMapText)).observe(target,{childList:true,subtree:true})}catch(e){}}function show(which){const isMap=which==='map';list.classList.toggle('on',!isMap);mapTab.classList.toggle('on',isMap);undo.classList.toggle('hidden',!isMap);lastState=null;lastKey='';undo.disabled=true;v.src=isMap?'./map.html?v=14':'./index.html?v=14';history.replaceState(null,'',isMap?'#map':'#list')}v.addEventListener('load',()=>{if(mapTab.classList.contains('on'))setTimeout(()=>{applyMapTextStyle();armUndo()},300)});undo.onclick=async()=>{if(!lastState)return;try{let w=v.contentWindow,current=w.eval('JSON.stringify(map)'),restore=lastState;w.eval('map='+JSON.stringify(JSON.parse(restore)));w.eval('data.frontRegisterMap=map;render()');applyMapTextStyle();await w.eval('save()');lastState=current;lastKey=restore;undo.disabled=false}catch(e){alert('戻す操作に失敗しました')}};list.onclick=()=>show('list');mapTab.onclick=()=>show('map');show(location.hash==='#map'?'map':'list');</script></body></html>
