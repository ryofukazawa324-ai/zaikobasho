<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>前レジ在庫マップ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 80px}.top,.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px;margin-bottom:12px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#6b7280}button{border:0;border-radius:11px;padding:9px 11px;font:inherit;font-weight:700}.primary{background:#2563eb;color:#fff}.ghost{background:#f9fafb;border:1px solid #e5e7eb}.small{font-size:12px;padding:7px 8px}.map{position:relative;width:100%;height:min(70vh,620px);min-height:440px;background-color:#fafafa;background-image:linear-gradient(#e5e7eb 1px,transparent 1px),linear-gradient(90deg,#e5e7eb 1px,transparent 1px);background-size:24px 24px;border:2px solid #d1d5db;border-radius:14px;overflow:hidden;touch-action:none}.block{position:absolute;border:2px solid #111827;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-size:12px;font-weight:900;box-shadow:0 2px 5px #0003;user-select:none}.edit .block{outline:2px dashed #fff8}.legend{display:grid;gap:8px}.legendItem{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:9px}.swatch{width:32px;height:32px;border-radius:7px;border:1px solid #111827}.modal{position:fixed;inset:0;background:#11182780;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.box{background:#fff;border-radius:18px;padding:15px;width:min(100%,620px)}.hidden{display:none!important}input,select{width:100%;font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.field{margin:9px 0}.label{font-size:12px;color:#6b7280;margin-bottom:4px}.color{width:54px;height:40px;padding:2px}.help{background:#fff7ed;border-color:#fed7aa}.back{text-decoration:none;color:#2563eb;font-weight:800}@media(min-width:700px){.modal{align-items:center}}</style></head><body><div class="wrap"><div class="card top"><div><a class="back" href="./">← 在庫</a><h1>前レジ在庫マップ</h1><div class="sub">小項目の色とマップの色が対応します</div></div><b id="code">---</b></div><div class="card bar"><b>配置マップ</b><div class="row"><button id="edit" class="ghost">編集モード</button><button id="add" class="primary hidden">＋四角</button></div></div><div id="help" class="card help hidden"><b>編集方法</b><div class="sub">下の「小項目と色」で各小項目の色を選択 → ＋四角でその小項目を選択 → 四角をドラッグして配置します。四角の中は選択した色1色です。</div></div><div class="card"><div id="map" class="map"></div></div><div class="card"><b>小項目と色</b><div class="sub">例：キャビネット＝青、前レジ中＝黄。色を見るだけで対応する在庫場所が分かります。</div><div id="legend" class="legend" style="margin-top:10px"></div></div></div><div id="modal" class="modal hidden"><div class="box"><h3>四角を追加</h3><div class="field"><div class="label">マップに表示する場所名</div><input id="name" placeholder="例：左キャビネット / レジ裏"></div><div class="field"><div class="label">対応する小項目</div><select id="group"></select></div><div class="field"><div class="label">形</div><select id="shape"><option value="wide">横長</option><option value="square">正方形</option><option value="tall">縦長</option></select></div><div class="row"><button id="cancel" class="ghost">キャンセル</button><button id="saveBlock" class="primary">追加</button></div></div></div><script>const U='https://gwmwynjkhxaywknhakcw.supabase.co',K='sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q',STORE='zaikobasho:lastCode',$=s=>document.querySelector(s);let code=localStorage.getItem(STORE)||'',data,front,map,editing=false,drag=null;const colors=['#60a5fa','#facc15','#4ade80','#fb7185','#c084fc','#22d3ee','#fb923c','#a3e635','#f472b6','#94a3b8'],hdr=(x={})=>({apikey:K,Authorization:`Bearer ${K}`,...x}),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!/^\d{3}$/.test(code)){location.href='./';return}$('#code').textContent=code;let r=await fetch(`${U}/rest/v1/zaikobasho_shared?code=eq.${code}&select=data`,{headers:hdr()}),a=await r.json();data=a[0]?.data||{sections:[]};front=data.sections.find(s=>s.name==='前レジ')||data.sections.find(s=>s.name.includes('前レジ'));if(!front){alert('「前レジ」項目がありません');location.href='./';return}front.groups=front.groups||[];map=data.frontRegisterMap||{blocks:[],groupColors:{}};map.blocks=map.blocks||[];map.groupColors=map.groupColors||{};front.groups.forEach((g,i)=>{if(!map.groupColors[g.id])map.groupColors[g.id]=colors[i%colors.length]});data.frontRegisterMap=map;render()}async function save(){await fetch(`${U}/rest/v1/zaikobasho_shared?on_conflict=code`,{method:'POST',headers:hdr({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({code,data,updated_at:new Date().toISOString()})})}function dims(s){return s==='square'?[22,18]:s==='tall'?[17,30]:[34,15]}function contrast(h){let n=parseInt(h.slice(1),16),v=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return v>160?'#111827':'#fff'}function render(){let el=$('#map');el.classList.toggle('edit',editing);el.innerHTML=map.blocks.map(b=>{let g=front.groups.find(x=>x.id===b.groupId),c=map.groupColors[b.groupId]||'#d1d5db',[w,h]=dims(b.shape);return`<div class="block" data-id="${b.id}" style="left:${b.x}%;top:${b.y}%;width:${w}%;height:${h}%;background:${c};color:${contrast(c)}">${esc(b.name||g?.name||'場所')}</div>`}).join('');$('#legend').innerHTML=front.groups.map(g=>{let c=map.groupColors[g.id];return`<div class="legendItem"><span class="swatch" style="background:${c}"></span><div><b>${esc(g.name)}</b><div class="sub">${esc((g.items||[]).map(i=>i.genre).filter(Boolean).join('、')||'メモを追加すると内容もここで確認できます')}</div></div>${editing?`<input class="color" type="color" value="${c}" data-color="${g.id}">`:''}</div>`}).join('')||'<div class="sub">前レジに小項目を作るとここに表示されます。</div>';$('#add').classList.toggle('hidden',!editing);$('#help').classList.toggle('hidden',!editing);$('#edit').textContent=editing?'編集終了':'編集モード'}$('#edit').onclick=()=>{editing=!editing;render()};$('#legend').onchange=async e=>{if(!e.target.dataset.color)return;map.groupColors[e.target.dataset.color]=e.target.value;render();await save()};$('#add').onclick=()=>{if(!front.groups.length)return alert('先に前レジに小項目を作ってください');$('#group').innerHTML=front.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');$('#name').value='';$('#modal').classList.remove('hidden')};$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#saveBlock').onclick=async()=>{let gid=$('#group').value,g=front.groups.find(x=>x.id===gid);map.blocks.push({id:crypto.randomUUID(),groupId:gid,name:$('#name').value.trim()||g.name,shape:$('#shape').value,x:4,y:4});$('#modal').classList.add('hidden');render();await save()};$('#map').onpointerdown=e=>{if(!editing)return;let el=e.target.closest('.block');if(!el)return;let b=map.blocks.find(x=>x.id===el.dataset.id),rect=$('#map').getBoundingClientRect(),er=el.getBoundingClientRect();drag={b,rect,dx:e.clientX-er.left,dy:e.clientY-er.top};el.setPointerCapture(e.pointerId)};$('#map').onpointermove=e=>{if(!drag)return;let[w,h]=dims(drag.b.shape);drag.b.x=Math.max(0,Math.min(100-w,(e.clientX-drag.rect.left-drag.dx)/drag.rect.width*100));drag.b.y=Math.max(0,Math.min(100-h,(e.clientY-drag.rect.top-drag.dy)/drag.rect.height*100));render()};$('#map').onpointerup=async()=>{if(drag){drag=null;await save()}};$('#map').ondblclick=async e=>{if(!editing)return;let el=e.target.closest('.block');if(!el)return;let b=map.blocks.find(x=>x.id===el.dataset.id),n=prompt('場所名',b.name);if(n!==null)b.name=n.trim()||b.name;if(confirm('この四角を削除しますか？'))map.blocks=map.blocks.filter(x=>x.id!==b.id);render();await save()};load();</script></body></html>
