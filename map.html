<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><title>前レジ在庫マップ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 80px}.top,.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px #0000000a}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#6b7280}button{border:0;border-radius:11px;padding:9px 11px;font:inherit;font-weight:700}.primary{background:#2563eb;color:#fff}.ghost{background:#f9fafb;border:1px solid #e5e7eb}.danger{background:#fff1f2;color:#dc2626}.small{font-size:12px;padding:7px 8px}.map{position:relative;width:100%;height:min(70vh,620px);min-height:440px;background-color:#fafafa;background-image:linear-gradient(#e5e7eb 1px,transparent 1px),linear-gradient(90deg,#e5e7eb 1px,transparent 1px);background-size:24px 24px;border:2px solid #d1d5db;border-radius:14px;overflow:hidden;touch-action:none}.block{position:absolute;border:2px solid #111827;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-size:12px;font-weight:900;line-height:1.15;box-shadow:0 2px 5px #0003;overflow:hidden;user-select:none}.edit .block{cursor:move;outline:2px dashed #fff8}.legend{display:grid;gap:8px}.legendItem{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:9px}.swatch{width:28px;height:28px;border-radius:7px;border:1px solid #111827}.modal{position:fixed;inset:0;background:#11182780;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.box{background:#fff;border-radius:18px;padding:15px;width:min(100%,620px);max-height:88vh;overflow:auto}.hidden{display:none!important}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.field{margin:9px 0}.label{font-size:12px;color:#6b7280;margin-bottom:4px}.colorInput{height:44px;padding:3px}.editHelp{background:#fff7ed;border-color:#fed7aa}.code{font-weight:900}.badge{font-size:11px;background:#ecfdf5;color:#047857;padding:4px 7px;border-radius:999px}@media(min-width:700px){.modal{align-items:center}}</style></head><body><div class="wrap"><div class="card top"><div><h1>前レジ在庫マップ</h1><div class="sub">新人スタッフ用・色と場所で在庫を確認</div></div><span class="badge">共有保存</span></div><div class="card bar"><div><div class="sub">店舗コード</div><div id="code" class="code">---</div></div><div class="row"><button id="edit" class="ghost">編集モード</button><button id="add" class="primary hidden">＋四角</button></div></div><div id="help" class="card editHelp hidden"><b>マップ編集</b><div class="sub">四角を指でドラッグして配置できます。四角の中は選んだ1色で塗られ、場所名だけを表示します。</div></div><div class="card"><div id="map" class="map"></div></div><div class="card"><div class="bar"><b>色ごとの在庫</b><button id="addCat" class="ghost small hidden">＋色項目</button></div><div id="legend" class="legend" style="margin-top:10px"></div></div></div><div id="modal" class="modal hidden"><div class="box"><h3 style="margin-top:0">四角を追加</h3><div class="field"><div class="label">場所の名前</div><input id="name" placeholder="例：レジ裏① / 柱横 / A棚"></div><div class="field"><div class="label">色項目</div><select id="cat"></select></div><div class="field"><div class="label">形</div><select id="shape"><option value="wide">横長</option><option value="square">正方形</option><option value="tall">縦長</option></select></div><div class="row"><button id="cancel" class="ghost">キャンセル</button><button id="saveBlock" class="primary">追加</button></div></div></div><script>const U='https://gwmwynjkhxaywknhakcw.supabase.co',K='sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q',STORE='zaikobasho:lastCode',$=s=>document.querySelector(s);let code=localStorage.getItem(STORE)||'',data=null,editing=false,drag=null;const uid=()=>crypto.randomUUID(),hdr=(x={})=>({apikey:K,Authorization:`Bearer ${K}`,...x}),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function defaultMap(){return{categories:[{id:uid(),name:'青',color:'#60a5fa',note:'インク・用紙など'},{id:uid(),name:'黄',color:'#facc15',note:'電池・ケーブルなど'},{id:uid(),name:'緑',color:'#4ade80',note:'ゲーム周辺機器など'}],blocks:[]}}async function load(){if(!/^\d{3}$/.test(code)){alert('先に「在庫」画面で3桁の店舗コードを開いてください');location.href='./';return}$('#code').textContent=code;let r=await fetch(`${U}/rest/v1/zaikobasho_shared?code=eq.${code}&select=data`,{headers:hdr()});let a=await r.json();data=a.length?a[0].data:{sections:[]};data.frontRegisterMap=data.frontRegisterMap||defaultMap();render()}async function save(){let r=await fetch(`${U}/rest/v1/zaikobasho_shared?on_conflict=code`,{method:'POST',headers:hdr({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({code,data,updated_at:new Date().toISOString()})});if(!r.ok)alert('保存に失敗しました')}function dims(s){return s==='square'?[22,18]:s==='tall'?[17,30]:[34,15]}function contrast(hex){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return .299*r+.587*g+.114*b>160?'#111827':'#fff'}function render(){let m=data.frontRegisterMap,map=$('#map');map.classList.toggle('edit',editing);map.innerHTML=m.blocks.map(b=>{let c=m.categories.find(x=>x.id===b.categoryId)||{color:'#d1d5db'},[w,h]=dims(b.shape);return`<div class="block" data-id="${b.id}" style="left:${b.x}%;top:${b.y}%;width:${w}%;height:${h}%;background:${c.color};color:${contrast(c.color)}">${esc(b.name)}</div>`}).join('');$('#legend').innerHTML=m.categories.map(c=>`<div class="legendItem"><span class="swatch" style="background:${c.color}"></span><div><b>${esc(c.name)}</b><div class="sub">${esc(c.note)}</div></div>${editing?`<button class="ghost small" data-cat-edit="${c.id}">編集</button>`:''}</div>`).join('')||'<div class="sub">色項目がありません</div>';$('#add').classList.toggle('hidden',!editing);$('#addCat').classList.toggle('hidden',!editing);$('#help').classList.toggle('hidden',!editing);$('#edit').textContent=editing?'編集終了':'編集モード'}$('#edit').onclick=()=>{editing=!editing;render()};$('#add').onclick=()=>{let sel=$('#cat');sel.innerHTML=data.frontRegisterMap.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');if(!sel.options.length)return alert('先に色項目を追加してください');$('#name').value='';$('#modal').classList.remove('hidden')};$('#cancel').onclick=()=>$('#modal').classList.add('hidden');$('#saveBlock').onclick=async()=>{let n=$('#name').value.trim();if(!n)return alert('場所名を入力してください');data.frontRegisterMap.blocks.push({id:uid(),name:n,categoryId:$('#cat').value,shape:$('#shape').value,x:5,y:5});$('#modal').classList.add('hidden');render();await save()};$('#addCat').onclick=async()=>{let name=prompt('色項目の名前（例：プリンター用品）');if(!name)return;let color=prompt('色コード', '#60a5fa');if(!/^#[0-9a-fA-F]{6}$/.test(color||''))return alert('例：#60a5fa の形式で入力してください');let note=prompt('この色にあるモノ', '')||'';data.frontRegisterMap.categories.push({id:uid(),name,color,note});render();await save()};$('#legend').onclick=async e=>{let b=e.target.closest('[data-cat-edit]');if(!b)return;let c=data.frontRegisterMap.categories.find(x=>x.id===b.dataset.catEdit),name=prompt('色項目名',c.name);if(name===null)return;let note=prompt('この色にあるモノ',c.note);if(note===null)return;let color=prompt('色コード',c.color);if(!/^#[0-9a-fA-F]{6}$/.test(color||''))return alert('色コードが不正です');c.name=name.trim()||c.name;c.note=note;c.color=color;render();await save()};$('#map').addEventListener('pointerdown',e=>{if(!editing)return;let el=e.target.closest('.block');if(!el)return;let b=data.frontRegisterMap.blocks.find(x=>x.id===el.dataset.id),rect=$('#map').getBoundingClientRect();drag={b,rect,dx:e.clientX-el.getBoundingClientRect().left,dy:e.clientY-el.getBoundingClientRect().top};el.setPointerCapture(e.pointerId)});$('#map').addEventListener('pointermove',e=>{if(!drag)return;let[w,h]=dims(drag.b.shape);drag.b.x=Math.max(0,Math.min(100-w,(e.clientX-drag.rect.left-drag.dx)/drag.rect.width*100));drag.b.y=Math.max(0,Math.min(100-h,(e.clientY-drag.rect.top-drag.dy)/drag.rect.height*100));render()});$('#map').addEventListener('pointerup',async()=>{if(drag){drag=null;await save()}});$('#map').addEventListener('dblclick',async e=>{if(!editing)return;let el=e.target.closest('.block');if(!el)return;let b=data.frontRegisterMap.blocks.find(x=>x.id===el.dataset.id),n=prompt('場所名',b.name);if(n===null)return;b.name=n.trim()||b.name;if(confirm('この四角を削除しますか？'))data.frontRegisterMap.blocks=data.frontRegisterMap.blocks.filter(x=>x.id!==b.id);render();await save()});load();</script></body></html>
