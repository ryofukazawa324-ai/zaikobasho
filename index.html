<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>在庫どこ？</title><style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--ok:#047857;--okbg:#ecfdf5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:720px;margin:auto;padding:18px 14px 80px}.top,.sectionHead,.toolbar,.itemTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:14px}h1{font-size:24px;margin:0}.sub,.status,.itemTime{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.04);margin-bottom:14px}.codeRow{display:flex;gap:10px}.code{flex:1;font-size:28px;font-weight:800;letter-spacing:.2em;text-align:center;padding:14px;border:2px solid var(--line);border-radius:14px}.code:focus{border-color:var(--accent);outline:none}button{font:inherit;border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#f9fafb;border:1px solid var(--line)}.danger{color:var(--danger);background:#fff1f2}.small{padding:7px 10px;font-size:13px}.badge{display:inline-flex;background:var(--okbg);color:var(--ok);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}.sectionTitle{font-size:18px;font-weight:800}.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.genre{font-weight:800}.note{white-space:pre-wrap;margin-top:5px;color:#374151}.actions{display:flex;gap:6px;flex-wrap:wrap}.addBox{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.addBox.open{display:block}.field{margin-bottom:9px}.label{font-size:12px;color:var(--muted);margin:0 0 4px 2px}input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:white}textarea{min-height:78px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.footerBtn{width:100%;margin-top:8px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.modalBox{width:min(100%,720px);background:#fff;border-radius:18px;padding:16px;max-height:86vh;overflow:auto}.photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}.editPanel{background:#fff7ed;border:1px solid #fed7aa}.dragRow{display:flex;align-items:center;gap:8px}.dragRow .sectionTitle{flex:1}.move{min-width:40px}.syncing{opacity:.6;pointer-events:none}@media(min-width:700px){.modal{align-items:center}.wrap{padding-top:28px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>在庫どこ？</h1><div class="sub">3桁コードごとの在庫場所メモ</div></div><span class="badge">共有保存</span></div><div class="card"><div class="codeRow"><input id="code" class="code" inputmode="numeric" maxlength="3" placeholder="000"><button id="openBtn" class="primary">開く</button></div><div id="status" class="status">3桁の数字を入力してください</div></div><div id="workspace" class="hidden"><div class="card toolbar"><div><div class="sub">現在のコード</div><div id="currentCode" style="font-size:26px;font-weight:900;letter-spacing:.12em"></div></div><div class="actions"><button id="editModeBtn" class="ghost small">編集モード</button><button id="addSectionBtn" class="ghost small">＋ 項目追加</button></div></div><div id="editNotice" class="card editPanel hidden"><b>編集モード</b><div class="sub">項目名の変更・並び替え・削除ができます。</div></div><div id="sections"></div></div></div>
<div id="sectionModal" class="modal hidden"><div class="modalBox"><h2>項目を追加</h2><div class="field"><div class="label">項目名</div><input id="newSectionName" maxlength="30" placeholder="例：サービスカウンター"></div><div class="row"><button id="cancelSection" class="ghost">キャンセル</button><button id="saveSection" class="primary">追加</button></div></div></div>
<script>
const SUPABASE_URL='https://gwmwynjkhxaywknhakcw.supabase.co',SUPABASE_KEY='sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q',BUCKET='zaikobasho-photos';
const DEFAULT_SECTIONS=['買い場','倉庫','前レジ'],$=s=>document.querySelector(s);let activeCode='',state={},editMode=false;
function blankState(){return{sections:DEFAULT_SECTIONS.map(name=>({id:crypto.randomUUID(),name,items:[]}))}}function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fmt(ts){return new Date(ts).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function headers(extra={}){return{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,...extra}}function setBusy(v){document.body.classList.toggle('syncing',v)}
async function loadRemote(code){const r=await fetch(`${SUPABASE_URL}/rest/v1/zaikobasho_shared?code=eq.${code}&select=data`,{headers:headers()});if(!r.ok)throw Error(r.status);const rows=await r.json();return rows.length?rows[0].data:blankState()}
async function saveRemote(){const r=await fetch(`${SUPABASE_URL}/rest/v1/zaikobasho_shared?on_conflict=code`,{method:'POST',headers:headers({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({code:activeCode,data:state,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(r.status);$('#status').textContent=`コード ${activeCode} を共有保存しました`}
async function save(){render();try{await saveRemote()}catch(e){console.error(e);alert('共有保存に失敗しました')}}
async function uploadPhoto(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${activeCode}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const r=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:headers({'Content-Type':file.type||'image/jpeg'}),body:file});if(!r.ok)throw Error('photo upload');return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`}
async function openCode(){const code=$('#code').value.replace(/\D/g,'').slice(0,3);$('#code').value=code;if(code.length!==3){$('#status').textContent='3桁の数字で入力してください';return}activeCode=code;setBusy(true);$('#status').textContent=`コード ${code} を読み込み中…`;try{state=await loadRemote(code);if(!state||!Array.isArray(state.sections))state=blankState();state.sections.forEach(s=>s.items=s.items||[]);$('#currentCode').textContent=code;$('#workspace').classList.remove('hidden');$('#status').textContent=`コード ${code} を表示中`;render()}finally{setBusy(false)}}
function itemHtml(it){return `<div class="item"><div class="itemTop"><div style="min-width:0;flex:1"><div class="genre">${esc(it.genre||'写真メモ')}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}${it.photoUrl?`<img class="photo" src="${esc(it.photoUrl)}" alt="写真メモ">`:''}<div class="itemTime">更新 ${fmt(it.updatedAt)}</div></div><div class="actions"><button class="ghost small" data-edit="${it.id}">編集</button><button class="danger small" data-del="${it.id}">削除</button></div></div></div>`}
function render(){const root=$('#sections');root.innerHTML='';$('#editNotice').classList.toggle('hidden',!editMode);$('#editModeBtn').textContent=editMode?'編集終了':'編集モード';state.sections.forEach((sec,idx)=>{const card=document.createElement('section');card.className='card';const editHead=editMode?`<div class="dragRow"><button class="ghost small move" data-up="${sec.id}" ${idx===0?'disabled':''}>↑</button><button class="ghost small move" data-down="${sec.id}" ${idx===state.sections.length-1?'disabled':''}>↓</button><div class="sectionTitle">${esc(sec.name)}</div><button class="ghost small" data-rename="${sec.id}">名前変更</button><button class="danger small" data-del-section="${sec.id}">削除</button></div>`:`<div class="sectionHead"><div class="sectionTitle">${esc(sec.name)}</div><div class="actions"><button class="ghost small" data-toggle="${sec.id}">＋ 商品</button><button class="ghost small" data-photo-toggle="${sec.id}">＋ 写真メモ</button></div></div>`;const items=sec.items.length?sec.items.map(itemHtml).join(''):'<div class="sub" style="padding:8px 0">まだ登録がありません</div>';card.innerHTML=editHead+items+(!editMode?`<div class="addBox" id="add-${sec.id}"><div class="field"><div class="label">商品ジャンル名</div><input data-genre="${sec.id}" placeholder="例：ノートPC / Wi-Fi / テレビ"></div><div class="field"><div class="label">補足</div><textarea data-note="${sec.id}" placeholder="例：棚の一番上、右奥"></textarea></div><button class="primary footerBtn" data-save-item="${sec.id}">保存</button></div><div class="addBox" id="photo-${sec.id}"><div class="field"><div class="label">写真</div><input type="file" accept="image/*" data-photo-file="${sec.id}"></div><div class="field"><div class="label">一言メモ</div><input data-photo-note="${sec.id}" maxlength="80" placeholder="例：この棚の右奥"></div><button class="primary footerBtn" data-save-photo="${sec.id}">写真メモを保存</button></div>`:'');root.appendChild(card)})}
$('#code').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,3));$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')openCode()});$('#openBtn').onclick=openCode;$('#editModeBtn').onclick=()=>{editMode=!editMode;render()};$('#addSectionBtn').onclick=()=>{$('#sectionModal').classList.remove('hidden');$('#newSectionName').focus()};$('#cancelSection').onclick=()=>$('#sectionModal').classList.add('hidden');$('#saveSection').onclick=async()=>{const name=$('#newSectionName').value.trim();if(!name)return;if(state.sections.some(s=>s.name===name)){alert('同じ項目名があります');return}state.sections.push({id:crypto.randomUUID(),name,items:[]});$('#newSectionName').value='';$('#sectionModal').classList.add('hidden');await save()};
$('#sections').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const sid=b.dataset.toggle||b.dataset.photoToggle||b.dataset.saveItem||b.dataset.savePhoto||b.dataset.rename||b.dataset.delSection||b.dataset.up||b.dataset.down;const sec=state.sections.find(s=>s.id===sid);if(b.dataset.toggle){$(`#add-${CSS.escape(sid)}`).classList.toggle('open');return}if(b.dataset.photoToggle){$(`#photo-${CSS.escape(sid)}`).classList.toggle('open');return}if(b.dataset.saveItem){const genre=document.querySelector(`[data-genre="${sid}"]`).value.trim(),note=document.querySelector(`[data-note="${sid}"]`).value.trim();if(!genre)return alert('商品ジャンル名を入力してください');sec.items.unshift({id:crypto.randomUUID(),genre,note,updatedAt:Date.now()});return save()}if(b.dataset.savePhoto){const file=document.querySelector(`[data-photo-file="${sid}"]`).files[0],note=document.querySelector(`[data-photo-note="${sid}"]`).value.trim();if(!file)return alert('写真を選んでください');if(file.size>3145728)return alert('写真は3MB以下にしてください');setBusy(true);try{const photoUrl=await uploadPhoto(file);sec.items.unshift({id:crypto.randomUUID(),genre:'写真メモ',note,photoUrl,updatedAt:Date.now()});await save()}catch(err){console.error(err);alert('写真の保存に失敗しました')}finally{setBusy(false)}return}if(b.dataset.rename){const name=prompt('項目名',sec.name);if(name===null||!name.trim())return;sec.name=name.trim();return save()}if(b.dataset.delSection){if(confirm(`「${sec.name}」を削除しますか？`)){state.sections=state.sections.filter(s=>s.id!==sid);await save()}return}if(b.dataset.up||b.dataset.down){const i=state.sections.findIndex(s=>s.id===sid),j=b.dataset.up?i-1:i+1;if(j>=0&&j<state.sections.length){[state.sections[i],state.sections[j]]=[state.sections[j],state.sections[i]];await save()}return}if(b.dataset.del||b.dataset.edit){const iid=b.dataset.del||b.dataset.edit,sec2=state.sections.find(s=>s.items.some(i=>i.id===iid)),it=sec2.items.find(i=>i.id===iid);if(b.dataset.del){if(confirm('このメモを削除しますか？')){sec2.items=sec2.items.filter(i=>i.id!==iid);await save()}return}const genre=prompt('商品ジャンル名',it.genre||'写真メモ');if(genre===null)return;const note=prompt('補足 / 一言メモ',it.note||'');if(note===null)return;it.genre=genre.trim()||'写真メモ';it.note=note.trim();it.updatedAt=Date.now();await save()}});
</script></body></html>
