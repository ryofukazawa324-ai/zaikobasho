<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>在庫どこ？</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--soft:#eff6ff;--ok:#047857;--okbg:#ecfdf5}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:720px;margin:auto;padding:18px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:24px;margin:0}.sub{font-size:12px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.04);margin-bottom:14px}
    .codeRow{display:flex;gap:10px}.code{flex:1;font-size:28px;font-weight:800;letter-spacing:.2em;text-align:center;padding:14px;border:2px solid var(--line);border-radius:14px;outline:none}.code:focus{border-color:var(--accent)}
    button{font:inherit;border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white}.ghost{background:#f9fafb;border:1px solid var(--line)}.danger{color:var(--danger);background:#fff1f2}.small{padding:7px 10px;font-size:13px}
    .status{margin-top:10px;font-size:13px;color:var(--muted)}
    .section{margin-top:14px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.sectionTitle{font-size:18px;font-weight:800}
    .item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.itemTop{display:flex;justify-content:space-between;gap:10px}.genre{font-weight:800}.note{white-space:pre-wrap;margin-top:5px;color:#374151}.itemTime{font-size:11px;color:var(--muted);margin-top:7px}
    .empty{color:var(--muted);font-size:13px;padding:8px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}
    .addBox{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.addBox.open{display:block}input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:none;background:white}textarea{min-height:78px;resize:vertical}.field{margin-bottom:9px}.label{font-size:12px;color:var(--muted);margin:0 0 4px 2px}
    .row{display:flex;gap:8px}.row>*{flex:1}.footerBtn{width:100%;margin-top:8px}.badge{display:inline-flex;align-items:center;background:var(--okbg);color:var(--ok);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}
    .hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.modalBox{width:min(100%,720px);background:white;border-radius:18px;padding:16px;max-height:86vh;overflow:auto}.modal h2{margin:0 0 12px;font-size:20px}
    .syncing{opacity:.6;pointer-events:none}
    @media(min-width:700px){.modal{align-items:center}.wrap{padding-top:28px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>在庫どこ？</h1><div class="sub">3桁コードごとの在庫場所メモ</div></div><span id="modeBadge" class="badge">共有保存</span></div>

  <div class="card">
    <div class="codeRow">
      <input id="code" class="code" inputmode="numeric" maxlength="3" placeholder="000" aria-label="3桁コード" />
      <button id="openBtn" class="primary">開く</button>
    </div>
    <div id="status" class="status">3桁の数字を入力してください</div>
  </div>

  <div id="workspace" class="hidden">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div><div class="sub">現在のコード</div><div id="currentCode" style="font-size:26px;font-weight:900;letter-spacing:.12em"></div></div>
        <button id="addSectionBtn" class="ghost small">＋ 項目追加</button>
      </div>
    </div>
    <div id="sections"></div>
  </div>
</div>

<div id="sectionModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalBox">
    <h2>項目を追加</h2>
    <div class="field"><div class="label">項目名</div><input id="newSectionName" placeholder="例：サービスカウンター" maxlength="30"></div>
    <div class="row"><button id="cancelSection" class="ghost">キャンセル</button><button id="saveSection" class="primary">追加</button></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://gwmwynjkhxaywknhakcw.supabase.co';
const SUPABASE_KEY='sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q';
const DEFAULT_SECTIONS=['買い場','倉庫','前レジ'];
const $=s=>document.querySelector(s);
let activeCode='';
let state={};

function blankState(){return {sections:DEFAULT_SECTIONS.map(name=>({id:crypto.randomUUID(),name,items:[]}))}}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(ts){try{return new Date(ts).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function headers(extra={}){return {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',...extra}}
function setBusy(v){document.body.classList.toggle('syncing',v)}

async function loadRemote(code){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/zaikobasho_shared?code=eq.${encodeURIComponent(code)}&select=data`,{headers:headers()});
  if(!res.ok) throw new Error(`load ${res.status}`);
  const rows=await res.json();
  return rows.length?rows[0].data:blankState();
}

async function saveRemote(){
  if(!activeCode)return;
  $('#status').textContent=`コード ${activeCode} を保存中…`;
  const res=await fetch(`${SUPABASE_URL}/rest/v1/zaikobasho_shared?on_conflict=code`,{
    method:'POST',
    headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({code:activeCode,data:state,updated_at:new Date().toISOString()})
  });
  if(!res.ok) throw new Error(`save ${res.status}`);
  $('#status').textContent=`コード ${activeCode} を共有保存しました`;
}

async function save(){
  render();
  try{await saveRemote()}catch(e){console.error(e);$('#status').textContent='保存に失敗しました。通信状態を確認してください';alert('共有保存に失敗しました')}
}

async function openCode(){
  const code=$('#code').value.replace(/\D/g,'').slice(0,3); $('#code').value=code;
  if(code.length!==3){$('#status').textContent='3桁の数字で入力してください';return}
  activeCode=code; $('#status').textContent=`コード ${code} を読み込み中…`; setBusy(true);
  try{
    state=await loadRemote(code);
    if(!state || !Array.isArray(state.sections)) state=blankState();
    $('#currentCode').textContent=code; $('#workspace').classList.remove('hidden'); $('#status').textContent=`コード ${code} を表示中`; render();
  }catch(e){console.error(e);$('#status').textContent='読み込みに失敗しました。通信状態を確認してください';}
  finally{setBusy(false)}
}

function render(){
  const root=$('#sections'); root.innerHTML='';
  state.sections.forEach(sec=>{
    const card=document.createElement('section'); card.className='card section';
    const items=sec.items.length?sec.items.map(it=>`<div class="item"><div class="itemTop"><div style="min-width:0"><div class="genre">${esc(it.genre)}</div><div class="note">${esc(it.note||'')}</div><div class="itemTime">更新 ${fmt(it.updatedAt)}</div></div><div class="actions"><button class="ghost small" data-edit="${it.id}">編集</button><button class="danger small" data-del="${it.id}">削除</button></div></div></div>`).join(''):'<div class="empty">まだ登録がありません</div>';
    card.innerHTML=`<div class="sectionHead"><div class="sectionTitle">${esc(sec.name)}</div><div class="actions"><button class="ghost small" data-toggle="${sec.id}">＋ 商品</button>${DEFAULT_SECTIONS.includes(sec.name)?'':`<button class="danger small" data-del-section="${sec.id}">項目削除</button>`}</div></div>${items}<div class="addBox" id="add-${sec.id}"><div class="field"><div class="label">商品ジャンル名</div><input data-genre="${sec.id}" placeholder="例：ノートPC / Wi-Fi / テレビ"></div><div class="field"><div class="label">補足</div><textarea data-note="${sec.id}" placeholder="例：棚の一番上、右奥。箱に赤いシールあり"></textarea></div><button class="primary footerBtn" data-save-item="${sec.id}">保存</button></div>`;
    root.appendChild(card);
  });
}

$('#code').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,3));
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')openCode()});
$('#openBtn').addEventListener('click',openCode);
$('#addSectionBtn').addEventListener('click',()=>{$('#sectionModal').classList.remove('hidden');setTimeout(()=>$('#newSectionName').focus(),50)});
$('#cancelSection').addEventListener('click',()=>$('#sectionModal').classList.add('hidden'));
$('#saveSection').addEventListener('click',async()=>{const name=$('#newSectionName').value.trim();if(!name)return;if(state.sections.some(s=>s.name===name)){alert('同じ項目名があります');return}state.sections.push({id:crypto.randomUUID(),name,items:[]});$('#newSectionName').value='';$('#sectionModal').classList.add('hidden');await save()});

$('#sections').addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b)return;
  const sid=b.dataset.toggle||b.dataset.saveItem||b.dataset.delSection; const sec=state.sections.find(s=>s.id===sid);
  if(b.dataset.toggle){document.querySelector(`#add-${CSS.escape(sid)}`).classList.toggle('open');return}
  if(b.dataset.saveItem){const genre=document.querySelector(`[data-genre="${sid}"]`).value.trim();const note=document.querySelector(`[data-note="${sid}"]`).value.trim();if(!genre){alert('商品ジャンル名を入力してください');return}sec.items.unshift({id:crypto.randomUUID(),genre,note,updatedAt:Date.now()});await save();return}
  if(b.dataset.delSection){if(confirm(`「${sec.name}」を削除しますか？`)){state.sections=state.sections.filter(s=>s.id!==sid);await save()}return}
  if(b.dataset.del||b.dataset.edit){const iid=b.dataset.del||b.dataset.edit;const sec2=state.sections.find(s=>s.items.some(i=>i.id===iid));const it=sec2.items.find(i=>i.id===iid);if(b.dataset.del){if(confirm('このメモを削除しますか？')){sec2.items=sec2.items.filter(i=>i.id!==iid);await save()}return}const genre=prompt('商品ジャンル名',it.genre);if(genre===null)return;const note=prompt('補足',it.note||'');if(note===null)return;if(!genre.trim())return;it.genre=genre.trim();it.note=note.trim();it.updatedAt=Date.now();await save()}
});
</script>
</body>
</html>
